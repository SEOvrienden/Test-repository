<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>JKZ — Verslag</title>
  <link rel="stylesheet" href="css/stijl.css">
</head>
<body>

<div class="pagina" style="height:100vh;height:100dvh;">

  <header class="hoofd">
    <a href="index.html" class="logo-link">
      <div class="logo-placeholder">
        <span class="logo-jkz">JKZ</span>
        <span class="logo-sub">since 1957</span>
      </div>
    </a>
    <div class="hoofd-rechts">
      <span id="verslag-header" class="klein" style="color:var(--accent);font-family:'Courier New',monospace;font-size:0.75rem;letter-spacing:0.08em;"></span>
    </div>
  </header>

  <div class="voortgang" id="voortgang"></div>

  <div class="verslag-artikel" id="verslag-artikel">
    <div class="laadbericht" id="laad-bericht">Verslag laden…</div>
  </div>

  <div class="verslag-voet" style="padding-bottom:0.75rem;">
    <a href="#" class="knop primair" id="knop-volgend-level">
      Naar level <span id="volgend-level-nr">2</span> →
    </a>
  </div>

</div>

<script type="module">
import { haalSpelerUitStorage, haalVoortgang, haalConfig } from './js/api.js';
import { renderVoortgang, renderNav, urlParam, checkGesloten } from './js/app.js';

if (checkGesloten()) throw new Error('gesloten');

renderNav('verslagen');

const level = parseInt(urlParam('level') || '1');
if (isNaN(level) || level < 1 || level > 7) {
  window.location.href = 'verslagen.html'; throw new Error();
}

const speler = haalSpelerUitStorage();
if (!speler) { window.location.href = 'index.html'; throw new Error(); }

// Alleen vrijgespeelde verslagen zijn leesbaar (testmodus opent alles)
const config = haalConfig();
const voortgang = await haalVoortgang(speler.spelerId);
const vrijgespeeld = level < voortgang.level || config.testmodus;
if (!vrijgespeeld) {
  window.location.href = 'verslagen.html'; throw new Error();
}

document.getElementById('verslag-header').textContent = `VERSLAG ${level}`;

// Voortgangsbalk
renderVoortgang(document.getElementById('voortgang'), level, voortgang.level - 1);

// Verslagtekst laden (los HTML-bestand, makkelijk zelf aan te passen)
const artikel = document.getElementById('verslag-artikel');
try {
  const res = await fetch(`verslag-teksten/verslag-${level}.html`);
  if (!res.ok) throw new Error(res.status);
  artikel.innerHTML = await res.text();
  artikel.scrollTop = 0;
} catch (e) {
  artikel.innerHTML = `<p style="color:var(--tekst-zwak);text-align:center;padding-top:2rem;">
    Dit verslag kon niet geladen worden.<br>
    Controleer of <code>verslag-teksten/verslag-${level}.html</code> op de server staat.</p>`;
}

// Knop onderin: volgend level, of de eindstand na het laatste verslag
const volgend = level + 1;
const volgendKnop = document.getElementById('knop-volgend-level');

if (volgend > 7 && voortgang.level > 7) {
  volgendKnop.href = 'ranglijst.html';
  volgendKnop.textContent = 'Bekijk eindstand →';
} else if (volgend === voortgang.level) {
  // Dit is de logische volgende stap in het spel
  document.getElementById('volgend-level-nr').textContent = volgend;
  volgendKnop.href = `spel.html?level=${volgend}`;
} else {
  // Oud verslag teruglezen → terug naar het overzicht
  volgendKnop.href = 'verslagen.html';
  volgendKnop.textContent = 'Terug naar alle verslagen';
}
</script>
</body>
</html>
