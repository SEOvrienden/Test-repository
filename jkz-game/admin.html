<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>JKZ — Beheer</title>
  <link rel="stylesheet" href="css/stijl.css?v=8">
</head>
<body>

<script>
// Vangnet: als de pagina niet goed laadt (bijv. oude bestanden in de cache
// of een halve upload), toon dan een duidelijke melding i.p.v. stil falen.
window.addEventListener('error', function (e) {
  if (!e || !e.message) return;
  if (document.getElementById('laadfout-banner')) return;
  var d = document.createElement('div');
  d.id = 'laadfout-banner';
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
    'background:#8a2020;color:#fff;padding:12px 16px;text-align:center;' +
    'font:14px/1.45 -apple-system,Segoe UI,sans-serif;';
  d.textContent = 'Oeps, de pagina is niet goed geladen. Sluit de browser helemaal af en open de site opnieuw. Blijft deze melding staan? Upload dan alle bestanden opnieuw naar de server.';
  document.body.appendChild(d);
}, true);
</script>

<div class="pagina">

  <header class="hoofd">
    <a href="index.html" class="logo-link">
      <div class="logo-placeholder">
        <span class="logo-jkz">JKZ</span>
        <span class="logo-sub">beheer</span>
      </div>
    </a>
  </header>

  <div class="inhoud" id="inhoud">
    <div class="laadbericht">Toegang controleren…</div>
  </div>

</div>

<script type="module">
import { haalSpelersOverzicht, haalSpelStatus, zetSpelStatus, zetTestmodus,
         resetAlles, resetSpeler } from './js/api.js?v=8';

// Sleutel uit URL halen; de server controleert of hij klopt
const params = new URLSearchParams(window.location.search);
const sleutel = params.get('key') || '';

const inhoud = document.getElementById('inhoud');
let spelers = [];

async function init() {
  try {
    spelers = await haalSpelersOverzicht(sleutel);
  } catch (e) {
    inhoud.innerHTML = `
      <div class="centervak" style="padding-top:3rem;text-align:center;">
        <div style="font-size:3rem;margin-bottom:1rem;">🔒</div>
        <h2>Geen toegang</h2>
        <p class="klein" style="max-width:320px;">${escapeHtml(e.message)}</p>
        <p class="klein" style="margin-top:0.5rem;">Gebruik <code>admin.html?key=JOUWSLEUTEL</code>
        met de sleutel uit config.php.</p>
      </div>`;
    return;
  }
  const status = await haalSpelStatus() || { open: true, testmodus: false };
  renderBeheer(status);
}

function renderBeheer(status) {
  inhoud.innerHTML = `
    <h1 style="margin-bottom:1.5rem;">Beheer</h1>

    <!-- STATUS -->
    <div class="admin-sectie">
      <h2>Status</h2>
      <div class="schakelaar">
        <input type="checkbox" id="cb-gesloten" ${status.open ? '' : 'checked'}>
        <label for="cb-gesloten">Spel gesloten (bezoekers zien gesloten-scherm)</label>
      </div>
      <div class="schakelaar">
        <input type="checkbox" id="cb-testmodus" ${status.testmodus ? 'checked' : ''}>
        <label for="cb-testmodus">Testmodus (alle levels en verslagen direct open)</label>
      </div>
      <button class="knop primair" id="knop-config-opslaan">Opslaan</button>
    </div>

    <!-- SPELERS OVERZICHT -->
    <div class="admin-sectie">
      <h2>Spelers (${spelers.length})</h2>
      <div id="spelers-lijst">${spelers.length === 0
        ? '<p class="klein">Nog geen spelers.</p>'
        : spelers.map(s => `<div class="admin-speler-rij">
            <span>${escapeHtml(s.naam)}</span>
            <span class="klein" style="color:var(--accent);text-align:right;">
              Level ${Math.min(s.level, 7)} | ${s.gespeeld}/7 spellen | ${s.totaal} pt<br>
              <span style="color:var(--tekst-zwak)">laatst actief: ${escapeHtml(s.laatste_actie || '–')}</span>
            </span>
          </div>`).join('')}</div>
    </div>

    <!-- RESET SPELER -->
    <div class="admin-sectie">
      <h2>Speler wissen</h2>
      <select class="selecteer" id="reset-speler-select">
        <option value="">— kies een speler —</option>
        ${spelers.map(s => `<option value="${s.id}">${escapeHtml(s.naam)}</option>`).join('')}
      </select>
      <button class="knop gevaar" id="knop-reset-speler">Wis deze speler</button>
    </div>

    <!-- RESET ALLES -->
    <div class="admin-sectie" style="border-color:rgba(212,84,26,0.3);">
      <h2 style="color:var(--simon-4);">Alles wissen</h2>
      <p class="klein" style="margin-bottom:0.75rem;">
        Dit verwijdert alle spelers en scores voor IEDEREEN — dit is de reset
        die je na de testfase doet, vlak voor 28 augustus.
        Typ <strong>RESET</strong> om te bevestigen.
      </p>
      <input type="text" id="reset-bevestig" class="invoer" placeholder="Typ RESET om te bevestigen">
      <button class="knop gevaar" id="knop-reset-alles">Alles wissen</button>
    </div>

    <p class="klein ta-c" style="margin-top:1rem;">
      <a href="eindstand.html" style="color:var(--accent);">Beameroverzicht →</a>
    </p>`;

  document.getElementById('knop-config-opslaan').addEventListener('click', async () => {
    try {
      await zetSpelStatus(sleutel, !document.getElementById('cb-gesloten').checked);
      await zetTestmodus(sleutel, document.getElementById('cb-testmodus').checked);
      toonMelding('Opgeslagen! Dit geldt nu voor iedereen.', 'ok');
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });

  document.getElementById('knop-reset-speler').addEventListener('click', async () => {
    const id = document.getElementById('reset-speler-select').value;
    if (!id) { toonMelding('Kies eerst een speler.', 'fout'); return; }
    const naam = spelers.find(s => s.id === id)?.naam || id;
    if (!confirm(`Wis ${naam}? Dit kan niet ongedaan worden.`)) return;
    try {
      await resetSpeler(sleutel, id);
      toonMelding(`${naam} gewist.`, 'ok');
      setTimeout(() => location.reload(), 1000);
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });

  document.getElementById('knop-reset-alles').addEventListener('click', async () => {
    if (document.getElementById('reset-bevestig').value !== 'RESET') {
      toonMelding('Typ exact RESET (hoofdletters).', 'fout'); return;
    }
    if (!confirm('Alle data van IEDEREEN wissen? Dit kan niet ongedaan worden!')) return;
    try {
      await resetAlles(sleutel);
      toonMelding('Alles gewist. Pagina herlaadt…', 'ok');
      setTimeout(() => location.reload(), 1500);
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });
}

function toonMelding(tekst, type) {
  const bestaand = document.getElementById('melding-banner');
  if (bestaand) bestaand.remove();
  const div = document.createElement('div');
  div.id = 'melding-banner';
  div.className = 'fout-banner';
  div.style.cssText = type === 'ok'
    ? 'background:rgba(39,174,96,0.15);border-color:#27ae60;color:#5dca8a;'
    : '';
  div.textContent = tekst;
  inhoud.prepend(div);
  setTimeout(() => div.remove(), 3000);
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
