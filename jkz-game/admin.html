<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>JKZ — Beheer</title>
  <link rel="stylesheet" href="css/stijl.css?v=20">
</head>
<body>

<script>
// Vangnet: als de pagina niet goed laadt (bijv. oude bestanden in de cache
// of een halve upload), toon dan een duidelijke melding i.p.v. stil falen.
window.addEventListener('error', function (e) {
  if (!e || !e.message) return;
  if (document.getElementById('laadfout-banner')) return;
  var d = document.createElement('div');
  d.id = 'laadfout-banner';
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
    'background:#8a2020;color:#fff;padding:12px 16px;text-align:center;' +
    'font:14px/1.45 -apple-system,Segoe UI,sans-serif;';
  d.textContent = 'Oeps, de pagina is niet goed geladen. Sluit de browser helemaal af en open de site opnieuw. Blijft deze melding staan? Upload dan alle bestanden opnieuw naar de server.';
  document.body.appendChild(d);
}, true);
</script>

<div class="pagina">

  <header class="hoofd">
    <a href="index.html" class="logo-link">
      <div class="logo-placeholder">
        <span class="logo-jkz">JKZ</span>
        <span class="logo-sub">beheer</span>
      </div>
    </a>
  </header>

  <div class="inhoud" id="inhoud">
    <div class="laadbericht">Toegang controleren…</div>
  </div>

</div>

<script type="module">
import { haalSpelersOverzicht, haalSpelStatus, zetSpelStatus, zetTestmodus,
         zetTikkieLink, zetBonus, resetAlles, resetSpeler, resetScores,
         resetBonus, toonPunten } from './js/api.js?v=20';

// Sleutel uit URL halen; de server controleert of hij klopt
const params = new URLSearchParams(window.location.search);
const sleutel = params.get('key') || '';

const inhoud = document.getElementById('inhoud');
let spelers = [];

async function init() {
  try {
    spelers = await haalSpelersOverzicht(sleutel);
  } catch (e) {
    inhoud.innerHTML = `
      <div class="centervak" style="padding-top:3rem;text-align:center;">
        <div style="font-size:3rem;margin-bottom:1rem;">🔒</div>
        <h2>Geen toegang</h2>
        <p class="klein" style="max-width:320px;">${escapeHtml(e.message)}</p>
        <p class="klein" style="margin-top:0.5rem;">Gebruik <code>admin.html?key=JOUWSLEUTEL</code>
        met de sleutel uit config.php.</p>
      </div>`;
    return;
  }
  const status = await haalSpelStatus() || { open: true, testmodus: false };
  renderBeheer(status);
}

function renderBeheer(status) {
  inhoud.innerHTML = `
    <h1 style="margin-bottom:1.5rem;">Beheer</h1>

    <!-- STATUS -->
    <div class="admin-sectie">
      <h2>Status</h2>
      <div class="schakelaar">
        <input type="checkbox" id="cb-gesloten" ${status.open ? '' : 'checked'}>
        <label for="cb-gesloten">Spel gesloten (bezoekers zien gesloten-scherm)</label>
      </div>
      <div class="schakelaar">
        <input type="checkbox" id="cb-testmodus" ${status.testmodus ? 'checked' : ''}>
        <label for="cb-testmodus">Testmodus (alle levels en verslagen direct open)</label>
      </div>
      <button class="knop primair" id="knop-config-opslaan">Opslaan</button>
    </div>

    <!-- BONUSPUNTEN / TIKKIE -->
    <div class="admin-sectie">
      <h2>Bonuspunten (Tikkie)</h2>
      <p class="klein" style="margin-bottom:0.75rem;">
        Spelers zien op het startscherm, de ranglijst en de uitlegpagina de
        gouden knop "Koop bonuspunten" met deze Tikkie-link.
        <strong>1 euro = 1 punt.</strong> Zie je in je Tikkie-app dat iemand
        betaald heeft? Vul hieronder het betaalde bedrag in als punten
        (0 = weer weghalen). Betaalt iemand nóg een keer? Tel het dan zelf
        bij het oude bedrag op.
      </p>
      <input type="text" id="tikkie-link" class="invoer" placeholder="https://tikkie.me/pay/..."
             value="${status.tikkie_link ? escapeHtml(status.tikkie_link) : ''}"
             style="margin-bottom:0.5rem;">
      <button class="knop" id="knop-tikkie-opslaan" style="margin-bottom:1rem;">Tikkie-link opslaan</button>

      <div style="display:flex;gap:8px;align-items:center;">
        <select class="selecteer" id="bonus-speler-select" style="flex:1;margin-bottom:0;">
          <option value="">— kies een speler —</option>
          ${spelers.map(s => `<option value="${s.id}">${escapeHtml(s.naam)}${s.bonus > 0 ? ' (heeft ' + toonPunten(s.bonus) + ' 💰)' : ''}</option>`).join('')}
        </select>
        <input type="text" inputmode="decimal" id="bonus-punten" class="invoer" value="25"
               placeholder="25" style="width:90px;margin-bottom:0;">
      </div>
      <button class="knop primair" id="knop-bonus-toekennen" style="margin-top:0.5rem;">
        Bonuspunten toekennen
      </button>
    </div>

    <!-- SPELERS OVERZICHT -->
    <div class="admin-sectie">
      <h2>Spelers (${spelers.length})</h2>
      <div id="spelers-lijst">${spelers.length === 0
        ? '<p class="klein">Nog geen spelers.</p>'
        : spelers.map(s => `<div class="admin-speler-rij">
            <span>${escapeHtml(s.naam)}</span>
            <span class="klein" style="color:var(--accent);text-align:right;">
              Level ${Math.min(s.level, 7)} | ${s.gespeeld}/7 spellen | ${toonPunten(s.totaal)} pt${s.bonus > 0 ? ' (waarvan ' + toonPunten(s.bonus) + ' 💰)' : ''}<br>
              <span style="color:var(--tekst-zwak)">laatst actief: ${escapeHtml(s.laatste_actie || '–')}</span>
            </span>
          </div>`).join('')}</div>
    </div>

    <!-- RESET SPELER -->
    <div class="admin-sectie">
      <h2>Speler wissen</h2>
      <select class="selecteer" id="reset-speler-select">
        <option value="">— kies een speler —</option>
        ${spelers.map(s => `<option value="${s.id}">${escapeHtml(s.naam)}</option>`).join('')}
      </select>
      <button class="knop gevaar" id="knop-reset-speler">Wis deze speler</button>
    </div>

    <!-- RESETS -->
    <div class="admin-sectie" style="border-color:rgba(212,84,26,0.3);">
      <h2 style="color:var(--simon-4);">Wissen &amp; resetten</h2>
      <p class="klein" style="margin-bottom:0.75rem;">
        Drie aparte resets, alle drie voor IEDEREEN en niet ongedaan te maken:
      </p>

      <p class="klein" style="margin-bottom:0.35rem;">
        <strong>1. Alleen spelscores wissen</strong> — spelers en bonuspunten
        blijven staan. Typ <strong>SCORES</strong> om te bevestigen.
      </p>
      <input type="text" id="reset-scores-bevestig" class="invoer" placeholder="Typ SCORES om te bevestigen">
      <button class="knop gevaar" id="knop-reset-scores" style="margin-bottom:1rem;">Wis alle spelscores</button>

      <p class="klein" style="margin-bottom:0.35rem;">
        <strong>2. Alleen bonuspunten wissen</strong> — spelers en spelscores
        blijven staan. Typ <strong>BONUS</strong> om te bevestigen.
      </p>
      <input type="text" id="reset-bonus-bevestig" class="invoer" placeholder="Typ BONUS om te bevestigen">
      <button class="knop gevaar" id="knop-reset-bonus" style="margin-bottom:1rem;">Wis alle bonuspunten</button>

      <p class="klein" style="margin-bottom:0.35rem;">
        <strong>3. Alles wissen</strong> — spelers, scores én bonuspunten weg.
        Dit is de grote reset na de testfase, vlak voor 28 augustus.
        Typ <strong>RESET</strong> om te bevestigen.
      </p>
      <input type="text" id="reset-bevestig" class="invoer" placeholder="Typ RESET om te bevestigen">
      <button class="knop gevaar" id="knop-reset-alles">Alles wissen</button>
    </div>

    <p class="klein ta-c" style="margin-top:1rem;">
      <a href="eindstand.html" style="color:var(--accent);">Beameroverzicht →</a>
    </p>`;

  document.getElementById('knop-tikkie-opslaan').addEventListener('click', async () => {
    try {
      await zetTikkieLink(sleutel, document.getElementById('tikkie-link').value.trim());
      toonMelding('Tikkie-link opgeslagen. Spelers zien de knop op de ranglijstpagina.', 'ok');
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });

  document.getElementById('knop-bonus-toekennen').addEventListener('click', async () => {
    const id = document.getElementById('bonus-speler-select').value;
    // Komma of punt mag allebei: "30,50" en "30.50" zijn allebei 30,5 punt
    const punten = parseFloat(document.getElementById('bonus-punten').value.replace(',', '.'));
    if (!id) { toonMelding('Kies eerst een speler.', 'fout'); return; }
    if (isNaN(punten) || punten < 0 || punten > 250) {
      toonMelding('Vul een aantal punten in tussen 0 en 250 (komma mag).', 'fout'); return;
    }
    try {
      await zetBonus(sleutel, id, punten);
      toonMelding('Bonuspunten toegekend! De ranglijst telt ze direct mee.', 'ok');
      setTimeout(() => location.reload(), 1200);
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });

  document.getElementById('knop-config-opslaan').addEventListener('click', async () => {
    try {
      await zetSpelStatus(sleutel, !document.getElementById('cb-gesloten').checked);
      await zetTestmodus(sleutel, document.getElementById('cb-testmodus').checked);
      toonMelding('Opgeslagen! Dit geldt nu voor iedereen.', 'ok');
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });

  document.getElementById('knop-reset-speler').addEventListener('click', async () => {
    const id = document.getElementById('reset-speler-select').value;
    if (!id) { toonMelding('Kies eerst een speler.', 'fout'); return; }
    const naam = spelers.find(s => s.id === id)?.naam || id;
    if (!confirm(`Wis ${naam}? Dit kan niet ongedaan worden.`)) return;
    try {
      await resetSpeler(sleutel, id);
      toonMelding(`${naam} gewist.`, 'ok');
      setTimeout(() => location.reload(), 1000);
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });

  document.getElementById('knop-reset-scores').addEventListener('click', async () => {
    if (document.getElementById('reset-scores-bevestig').value !== 'SCORES') {
      toonMelding('Typ exact SCORES (hoofdletters).', 'fout'); return;
    }
    if (!confirm('Alle spelscores van IEDEREEN wissen? Spelers en bonuspunten blijven staan.')) return;
    try {
      await resetScores(sleutel);
      toonMelding('Alle spelscores gewist. Pagina herlaadt…', 'ok');
      setTimeout(() => location.reload(), 1500);
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });

  document.getElementById('knop-reset-bonus').addEventListener('click', async () => {
    if (document.getElementById('reset-bonus-bevestig').value !== 'BONUS') {
      toonMelding('Typ exact BONUS (hoofdletters).', 'fout'); return;
    }
    if (!confirm('Alle bonuspunten van IEDEREEN wissen? Spelers en spelscores blijven staan.')) return;
    try {
      await resetBonus(sleutel);
      toonMelding('Alle bonuspunten gewist. Pagina herlaadt…', 'ok');
      setTimeout(() => location.reload(), 1500);
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });

  document.getElementById('knop-reset-alles').addEventListener('click', async () => {
    if (document.getElementById('reset-bevestig').value !== 'RESET') {
      toonMelding('Typ exact RESET (hoofdletters).', 'fout'); return;
    }
    if (!confirm('Alle data van IEDEREEN wissen? Dit kan niet ongedaan worden!')) return;
    try {
      await resetAlles(sleutel);
      toonMelding('Alles gewist. Pagina herlaadt…', 'ok');
      setTimeout(() => location.reload(), 1500);
    } catch (e) { toonMelding('Fout: ' + e.message, 'fout'); }
  });
}

function toonMelding(tekst, type) {
  const bestaand = document.getElementById('melding-banner');
  if (bestaand) bestaand.remove();
  const div = document.createElement('div');
  div.id = 'melding-banner';
  div.className = 'fout-banner';
  div.style.cssText = type === 'ok'
    ? 'background:rgba(39,174,96,0.15);border-color:#27ae60;color:#5dca8a;'
    : '';
  div.textContent = tekst;
  inhoud.prepend(div);
  setTimeout(() => div.remove(), 3000);
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
