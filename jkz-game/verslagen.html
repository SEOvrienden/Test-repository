<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>JKZ — Verslagen</title>
  <link rel="stylesheet" href="css/stijl.css?v=29">
</head>
<body>

<script>
// Vangnet: als de pagina niet goed laadt (bijv. oude bestanden in de cache
// of een halve upload), toon dan een duidelijke melding i.p.v. stil falen.
window.addEventListener('error', function (e) {
  if (!e || !e.message) return;
  if (document.getElementById('laadfout-banner')) return;
  var d = document.createElement('div');
  d.id = 'laadfout-banner';
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
    'background:#8a2020;color:#fff;padding:12px 16px;text-align:center;' +
    'font:14px/1.45 -apple-system,Segoe UI,sans-serif;';
  d.textContent = 'Oeps, de pagina is niet goed geladen. Sluit de browser helemaal af en open de site opnieuw. Blijft deze melding staan? Upload dan alle bestanden opnieuw naar de server.';
  document.body.appendChild(d);
}, true);
</script>

<div class="pagina">

  <header class="hoofd">
    <a href="index.html" class="logo-link">
      <div class="logo-placeholder">
        <span class="logo-jkz">JKZ</span>
        <span class="logo-sub">since 1957</span>
      </div>
    </a>
  </header>

  <div class="voortgang" id="voortgang"></div>

  <div class="inhoud" style="overflow-y:auto;">
    <h1 style="margin-bottom:0.25rem;">Verslagen</h1>
    <p class="klein" style="margin-bottom:0.85rem;">
      Elk level dat je speelt, opent een verslag. De historie en awards van
      JKZ staan hieronder altijd voor je open:
    </p>

    <div class="over-jkz-rij" style="margin:0 0 1.25rem;">
      <a href="historie.html" class="over-jkz-kaart">
        <span class="over-jkz-icoon">📜</span>
        <span>Historie<br><small>Voorzitters, senatoren en ereleden</small></span>
      </a>
      <a href="awards.html" class="over-jkz-kaart">
        <span class="over-jkz-icoon">🏆</span>
        <span>Awards<br><small>Van Daan Bolding tot ShoarmAward</small></span>
      </a>
    </div>

    <div id="verslagen-lijst">
      <div class="laadbericht">Laden…</div>
    </div>
  </div>

</div>

<script type="module">
import { haalSpelerUitStorage, haalVoortgang, haalConfig } from './js/api.js?v=29';
import { renderVoortgang, renderNav, checkGesloten, initScrollHint } from './js/app.js?v=29';
import { VERSLAG_TITELS } from './js/titels.js?v=29';

if (checkGesloten()) throw new Error('gesloten');

renderNav('verslagen');

const speler = haalSpelerUitStorage();
if (!speler) { window.location.href = 'index.html'; throw new Error(); }

const config = haalConfig();
const voortgang = await haalVoortgang(speler.spelerId)
  .catch(() => { throw new Error('gesloten'); }); // stil bij wegklikken tijdens laden

renderVoortgang(document.getElementById('voortgang'),
  Math.min(voortgang.level, 10), voortgang.level - 1);

const TITELS = VERSLAG_TITELS;

const lijst = document.getElementById('verslagen-lijst');
lijst.innerHTML = '';

for (let n = 1; n <= 10; n++) {
  const open = n < voortgang.level || config.testmodus;

  if (open) {
    const kaart = document.createElement('a');
    kaart.className = 'verslag-kaart';
    kaart.href = `verslag.html?level=${n}`;
    kaart.innerHTML = `
      <span class="kaart-icoon">📖</span>
      <span>
        <span class="kaart-titel" style="display:block;">${TITELS[n]}</span>
        <span class="kaart-sub">Vrijgespeeld — tik om te lezen</span>
      </span>`;
    lijst.appendChild(kaart);
  } else {
    const kaart = document.createElement('div');
    kaart.className = 'verslag-kaart op-slot';
    kaart.innerHTML = `
      <span class="kaart-icoon">🔒</span>
      <span>
        <span class="kaart-titel" style="display:block;">${TITELS[n]}</span>
        <span class="kaart-sub">Speel level ${n} om dit verslag te openen</span>
      </span>`;
    lijst.appendChild(kaart);
  }
}

// Hint als er nog niets open is
if (voortgang.level === 1 && !config.testmodus) {
  const hint = document.createElement('p');
  hint.className = 'klein ta-c';
  hint.style.cssText = 'color:var(--tekst-zwak);margin-top:1rem;';
  hint.innerHTML = 'Nog niets vrijgespeeld. <a href="spel.html?level=1" style="color:var(--accent);">Start level 1 →</a>';
  lijst.appendChild(hint);
}

initScrollHint(300);
</script>
</body>
</html>
