<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>JKZ — Ranglijst</title>
  <link rel="stylesheet" href="css/stijl.css?v=12">
</head>
<body>

<script>
// Vangnet: als de pagina niet goed laadt (bijv. oude bestanden in de cache
// of een halve upload), toon dan een duidelijke melding i.p.v. stil falen.
window.addEventListener('error', function (e) {
  if (!e || !e.message) return;
  if (document.getElementById('laadfout-banner')) return;
  var d = document.createElement('div');
  d.id = 'laadfout-banner';
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
    'background:#8a2020;color:#fff;padding:12px 16px;text-align:center;' +
    'font:14px/1.45 -apple-system,Segoe UI,sans-serif;';
  d.textContent = 'Oeps, de pagina is niet goed geladen. Sluit de browser helemaal af en open de site opnieuw. Blijft deze melding staan? Upload dan alle bestanden opnieuw naar de server.';
  document.body.appendChild(d);
}, true);
</script>

<div class="pagina">

  <header class="hoofd">
    <a href="index.html" class="logo-link">
      <div class="logo-placeholder">
        <span class="logo-jkz">JKZ</span>
        <span class="logo-sub">since 1957</span>
      </div>
    </a>
  </header>

  <div class="voortgang" id="voortgang"></div>

  <div class="inhoud" style="padding:0;">

    <div style="padding:1rem 1rem 0.5rem;display:flex;justify-content:space-between;align-items:center;">
      <h1 style="margin:0;font-size:1.4rem;">Ranglijst</h1>
      <span class="klein" id="ververs-label" style="color:var(--tekst-zwak);"></span>
    </div>

    <!-- Steun de clubkas (verschijnt alleen als er een Tikkie-link is ingesteld) -->
    <div style="padding:0 1rem;" id="clubkas-vak"></div>

    <!-- Tabbladen: totaal + één per spel -->
    <div class="rang-tabs" id="rang-tabs"></div>

    <div style="padding:0 0 1rem;">
      <table class="ranglijst-tabel" id="ranglijst-tabel">
        <thead>
          <tr>
            <th>#</th>
            <th>Naam</th>
            <th style="text-align:right;" id="kolom-punten">Punten</th>
          </tr>
        </thead>
        <tbody id="ranglijst-body"></tbody>
      </table>
      <p class="klein" id="tab-voetnoot" style="padding:0.5rem 1rem 0;color:var(--tekst-zwak);"></p>
    </div>

  </div>
</div>

<script type="module">
import { haalRanglijst, haalSpelerUitStorage, haalVoortgang, verversStatus,
         toonPunten } from './js/api.js?v=12';
import { renderVoortgang, renderNav, renderBonusCTA, checkGesloten } from './js/app.js?v=12';

if (checkGesloten()) throw new Error('gesloten');

renderNav('ranglijst');

const speler = haalSpelerUitStorage();

// Gouden bonuspunten-knop bovenaan (verdwijnt als er geen Tikkie-link is)
const clubkasVak = document.getElementById('clubkas-vak');
renderBonusCTA(clubkasVak);
verversStatus().then(() => renderBonusCTA(clubkasVak));

async function laadVoortgang() {
  if (speler) {
    const vg = await haalVoortgang(speler.spelerId);
    renderVoortgang(document.getElementById('voortgang'), vg.level, vg.level - 1);
  }
}
laadVoortgang();

let verversInterval = null;
let tellerInterval = null;
let volgendeVervers = 15;

async function laadRanglijst() {
  try {
    const data = await haalRanglijst();
    renderRanglijst(data);
    volgendeVervers = 15;
  } catch (e) {
    console.error('Ranglijst laden mislukt', e);
  }
}

// ── Tabbladen: Totaal + één per spel ─────────────────────────────────────────

const SPEL_NAMEN = ['Reactie', 'Breakout', 'Simon', 'Mep', 'Snake', 'Flappy', 'Pong'];
let actieveTab = 'totaal';   // 'totaal' of spelnummer 1–7
let laatsteData = null;

function renderTabs() {
  const tabsDiv = document.getElementById('rang-tabs');
  tabsDiv.innerHTML = '';
  const tabs = [['totaal', '🏆 Totaal'], ...SPEL_NAMEN.map((n, i) => [i + 1, n])];
  tabs.forEach(([key, label]) => {
    const knop = document.createElement('button');
    knop.className = 'rang-tab' + (String(key) === String(actieveTab) ? ' actief' : '');
    knop.textContent = label;
    knop.addEventListener('click', () => {
      actieveTab = key;
      renderTabs();
      if (laatsteData) renderRanglijst(laatsteData);
    });
    tabsDiv.appendChild(knop);
  });
}
renderTabs();

function renderRanglijst(data) {
  laatsteData = data;
  const tbody = document.getElementById('ranglijst-body');
  const voetnoot = document.getElementById('tab-voetnoot');
  const kolom = document.getElementById('kolom-punten');
  tbody.innerHTML = '';
  voetnoot.textContent = '';

  if (data.length === 0) {
    kolom.textContent = 'Punten';
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:var(--tekst-zwak);padding:2rem;">
      Nog niemand gespeeld.</td></tr>`;
    return;
  }

  let rijen;
  if (actieveTab === 'totaal') {
    kolom.textContent = 'Totaal';
    // De 💰 laat zien dát iemand de clubkas gesteund heeft — niet hoeveel.
    rijen = data.map(r => ({
      naam: r.naam,
      tekst: toonPunten(r.totaal) + (r.bonus > 0 ? ' <span style="font-size:0.75rem;">💰</span>' : ''),
      sorteer: r.totaal,
    }));
    voetnoot.innerHTML = '💰 = heeft extra punten gekocht &nbsp;·&nbsp; tik op een spelnaam voor de stand per spel';
  } else {
    const s = Number(actieveTab);
    kolom.textContent = 'Score';
    rijen = data
      .filter(r => r.scores[s] !== undefined && r.scores[s] !== null)
      .map(r => ({ naam: r.naam, tekst: String(r.scores[s]), sorteer: r.scores[s] }))
      .sort((a, b) => b.sorteer - a.sorteer);
    if (rijen.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:var(--tekst-zwak);padding:2rem;">
        Nog niemand heeft ${SPEL_NAMEN[s - 1]} gespeeld.</td></tr>`;
      return;
    }
    voetnoot.textContent = `Spel ${s} — ${SPEL_NAMEN[s - 1]} · ${rijen.length} van ${data.length} spelers gespeeld · max 100 punten`;
  }

  rijen.forEach((rij, idx) => {
    const tr = document.createElement('tr');
    const eigenRij = speler && rij.naam === speler.naam;
    if (eigenRij) tr.classList.add('eigen-rij');
    const positie = idx + 1;
    const positieTekst = positie <= 3 ? ['🥇', '🥈', '🥉'][positie - 1] : positie;
    tr.innerHTML = `
      <td><span class="rangpositie">${positieTekst}</span></td>
      <td>${eigenRij ? '▶ ' : ''}${escapeHtml(rij.naam)}</td>
      <td class="totaal" style="text-align:right;">${rij.tekst}</td>`;
    tbody.appendChild(tr);
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Auto-refresh elke 15 seconden
laadRanglijst();
verversInterval = setInterval(laadRanglijst, 15000);

// Countdown
const vervLabel = document.getElementById('ververs-label');
tellerInterval = setInterval(() => {
  volgendeVervers--;
  if (volgendeVervers <= 0) volgendeVervers = 15;
  vervLabel.textContent = `Ververst over ${volgendeVervers}s`;
}, 1000);
</script>
</body>
</html>
