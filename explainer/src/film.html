<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>SEO vs SEA explainer</title>
<style>
  html, body { margin: 0; background: #F4EFE6; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="timeline.js"></script>
<script>
  // Fonts eerst: de layout meet tekst bij het laden.
  const faces = [
    new FontFace('Inter', 'url(fonts/Inter-Regular.otf)', { weight: '400' }),
    new FontFace('Inter', 'url(fonts/Inter-SemiBold.otf)', { weight: '600' }),
    new FontFace('Caladea', 'url(fonts/Caladea-Regular.ttf)', { weight: '400' }),
    new FontFace('Caladea', 'url(fonts/Caladea-Bold.ttf)', { weight: '700' }),
  ];
  const load = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  window.ready = Promise.all(faces.map((f) => f.load().then((ff) => document.fonts.add(ff))))
    .then(() => load('film.js'))
    .then(() => load('audio.js'))
    .then(() => { const t = +(new URLSearchParams(location.search).get('t') || 0); window.seek(t); return true; });
</script>
</body>
</html>
